# yaml-language-server: $schema=https://platform.claude.com/schemas/ant/beta/environment.json
name: growth-experiment-reviewer-cloud
description: Cloud sandbox with no network access. The agent works only from what you paste; the shell, web search and web fetch are disabled in the agent, and nothing secret is stored here.
config:
  type: cloud
  networking:
    type: limited
    allow_package_managers: false
